[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipymini"
dynamic = ["version"]
description = "A small, readable Jupyter kernel for Python with strong IPython parity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "comm>=0.2.3",
  "fastcore>=2.2.16",
  "ipython>=8.18",
  "kernmini>=0.1.10",
]

[project.optional-dependencies]
dev = [
  "jupyter_client>=8.6",
  "pytest>=7.4",
  "pytest-asyncio>=1.0",
  "pytest-xdist",
  "pytest-timeout",
  "conkernelclient>=0.0.17",
  "matplotlib>=3.8",
  "ipykernel>=6.29",
  "debugpy>=1.8",
  "murmurhash2",
  "fastship",
  "build",
  "twine",
]

[project.scripts]
ipymini = "ipymini.__main__:main"

[tool.hatch.version]
path = "ipymini/__init__.py"

[tool.hatch.build.targets.wheel.shared-data]
"share/jupyter/kernels/py/kernel.json" = "share/jupyter/kernels/py/kernel.json"

[tool.chkstyle]
skip-folder-re = "meta"
